<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1a120c" />
  <title>Нурлан Джамалдинов</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="screen">
    <div class="screen__photo" aria-hidden="true"></div>

    <video
      class="screen__video"
      src="assets/videos/highlight-01-original.mp4"
      poster="assets/photos/stage-crowd.png"
      autoplay
      muted
      loop
      playsinline
      preload="metadata"
    ></video>

    <div class="screen__overlay"></div>

    <main class="screen__content">
      <h1 class="screen__name">
        <span class="screen__name-line">Нурлан</span>
        <span class="screen__name-line">Джамалдинов</span>
      </h1>
      <p class="screen__contact">
        <span class="screen__contact-label">Связаться</span>
        <span class="screen__contact-phone">+7 (938) 077-69-90</span>
      </p>
    </main>
  </div>

  <script src="main.js"></script>
</body>
</html>
